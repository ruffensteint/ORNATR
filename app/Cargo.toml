[package]
name = "ornatr"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
description = "ORNATR: procedural acanthus scroll patterns for carving (native desktop app)."

[dependencies]
scroll_core = { path = "../core" }
eframe = "0.29.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# std::time on the desktop; the browser's clock in the web edition
web-time = "1"

# the desktop program: file dialogs
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"
